<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Executive English — หลักสูตร 24 เดือน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#141a30; --ink-soft:#2b3358;
    --paper:#f6f3ea; --paper-raised:#ffffff;
    --line:#e0dbc9;
    --brass:#96751f; --brass-soft:#f1e8d4; --brass-deep:#6e5720;
    --seal:#7c3131; --seal-soft:#f4e3e0;
    --slate:#5b6472; --slate-light:#8890a0;
    --font-serif:'Source Serif 4', Georgia, 'Times New Roman', serif;
    --font-sans:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono:'Source Serif 4', Georgia, serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ink:#eef0f6; --ink-soft:#c7cde0;
      --paper:#0f1224; --paper-raised:#171b34;
      --line:#2c3356;
      --brass:#d9b96a; --brass-soft:#332a13; --brass-deep:#e8cc8f;
      --seal:#d97c7c; --seal-soft:#301a1a;
      --slate:#a3aac2; --slate-light:#7a81a0;
    }
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-sans);min-height:100vh;}
  h1,h2,h3,.serif{font-family:var(--font-serif);font-weight:600;letter-spacing:-0.01em;}
  button{font-family:var(--font-sans);cursor:pointer;}
  #app{max-width:960px;margin:0 auto;padding:28px 20px 90px;}
  .nums{font-variant-numeric:tabular-nums;}

  /* ---- Hero: styled as the cover plate of an issued credential ---- */
  .cover{background:var(--ink);color:var(--paper);border-radius:4px 4px 0 0;padding:38px 34px 28px;position:relative;overflow:hidden;}
  .cover::before{content:'';position:absolute;inset:8px;border:1px solid rgba(212,184,122,0.35);border-radius:2px;pointer-events:none;}
  .cover .crest{width:46px;height:46px;border:1.5px solid var(--brass);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-serif);font-weight:700;font-size:1.05rem;color:var(--brass);flex-shrink:0;}
  .cover-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;}
  .cover .mark{font-family:var(--font-serif);font-size:0.82rem;letter-spacing:0.06em;color:var(--brass);display:block;}
  .cover h1{font-size:1.9rem;margin:8px 0 12px;color:var(--paper);line-height:1.25;}
  .cover p{color:#c7cde0;max-width:540px;line-height:1.7;margin:0;font-size:0.95rem;}
  .cover-meta{display:flex;gap:0;flex-wrap:wrap;margin-top:26px;padding-top:18px;border-top:1px solid rgba(212,184,122,0.3);}
  .cover-meta .field{padding:0 22px 0 0;margin-right:22px;border-right:1px solid rgba(212,184,122,0.25);}
  .cover-meta .field:last-child{border-right:none;}
  .cover-meta .field b{display:block;font-family:var(--font-serif);font-size:1.15rem;color:var(--paper);}
  .cover-meta .field span{font-size:0.72rem;color:#8890a0;letter-spacing:0.03em;}
  @media(max-width:600px){.cover{padding:28px 20px 22px;} .cover-meta .field{padding-right:14px;margin-right:14px;}}

  /* ---- Level stamp trail ---- */
  .stamptrail{display:flex;align-items:center;gap:0;margin:26px 0 6px;overflow-x:auto;padding-bottom:4px;}
  .stamp{display:flex;flex-direction:column;align-items:center;flex-shrink:0;}
  .stamp .dot{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--brass);display:flex;align-items:center;justify-content:center;font-family:var(--font-serif);font-weight:700;font-size:0.78rem;color:var(--brass-deep);background:var(--brass-soft);}
  .stamp .dot.origin{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .stamp .lvl{font-size:0.68rem;color:var(--slate);margin-top:5px;}
  .stamp-link{width:26px;height:1.5px;background:var(--line);flex-shrink:0;}
  .stamp-link.active{background:var(--brass);}

  .timeline{display:flex;flex-direction:column;margin:8px 0 44px;position:relative;}
  .timeline::before{content:'';position:absolute;left:15px;top:6px;bottom:6px;width:1px;background:var(--line);}
  .phase-row{display:flex;gap:18px;padding:18px 0;position:relative;}
  .phase-num{font-family:var(--font-serif);font-size:0.82rem;font-weight:700;width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--paper-raised);border:1px solid var(--line);color:var(--slate);z-index:1;}
  .phase-row.current .phase-num{border-color:var(--seal);color:var(--seal);background:var(--seal-soft);}
  .phase-title{font-weight:600;font-size:1rem;}
  .phase-range{font-size:0.8rem;color:var(--slate);margin-top:2px;}
  .phase-focus{font-size:0.83rem;color:var(--slate);margin-top:6px;line-height:1.6;}
  .phase-focus span{display:inline-block;padding-right:14px;position:relative;}
  .phase-focus span:not(:last-child)::after{content:'';position:absolute;right:6px;top:8px;width:3px;height:3px;border-radius:50%;background:var(--line);}

  /* ---- Search ---- */
  .search-wrap{position:relative;margin-bottom:14px;}
  input[type=text]{width:100%;padding:13px 14px 13px 38px;border:1px solid var(--line);border-radius:6px;font-family:var(--font-sans);font-size:0.95rem;background:var(--paper-raised);color:var(--ink);}
  input[type=text]:focus{outline:2px solid var(--brass);outline-offset:1px;}
  .search-wrap svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--slate-light);pointer-events:none;}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px;}
  .chip{font-size:0.78rem;padding:6px 12px;border:1px solid var(--line);border-radius:20px;background:var(--paper-raised);color:var(--slate);}
  .chip:hover{border-color:var(--brass);color:var(--brass-deep);}

  /* ---- Month entries: ledger rows, not uniform SaaS cards ---- */
  .card{background:var(--paper-raised);border:1px solid var(--line);border-left:2px solid var(--line);border-radius:2px;padding:0;overflow:hidden;margin-bottom:10px;transition:border-left-color .15s;}
  .card.open{border-left-color:var(--brass);}
  .month-header{cursor:pointer;padding:15px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;}
  .month-header:hover .mh-title{color:var(--brass-deep);}
  .month-header .mh-left{display:flex;align-items:baseline;gap:12px;}
  .month-header .mh-num{font-family:var(--font-serif);font-size:0.78rem;color:var(--slate-light);width:20px;}
  .month-header .mh-title{font-family:var(--font-serif);font-size:1.02rem;font-weight:600;}
  .month-header .mh-sub{color:var(--slate);font-size:0.83rem;}
  .month-header .mh-toggle{color:var(--slate-light);font-size:0.75rem;flex-shrink:0;}
  .month-body{padding:0 18px 16px 18px;}
  .week-block{border-top:1px solid var(--line);padding:14px 0;}
  .week-title{font-weight:600;font-size:0.93rem;}
  .week-title .num{color:var(--brass-deep);font-family:var(--font-serif);margin-right:6px;}
  .week-output{font-size:0.83rem;color:var(--slate);margin:4px 0 8px;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:0;}
  @media(max-width:600px){.grid{grid-template-columns:1fr;}}
  .vocab-item{font-size:0.83rem;padding:4px 10px 4px 0;border-bottom:1px solid var(--line);}

  /* ---- Empty state: guides the next action instead of sitting flat ---- */
  .empty{text-align:center;padding:50px 20px;}
  .empty .empty-icon{color:var(--slate-light);margin-bottom:12px;}
  .empty .empty-title{font-family:var(--font-serif);font-size:1.05rem;margin-bottom:6px;}
  .empty .empty-sub{color:var(--slate);font-size:0.88rem;margin-bottom:18px;}
  .empty .chips{justify-content:center;}

  footer{color:var(--slate-light);font-size:0.78rem;text-align:center;padding:30px 0 10px;}

  /* ---- Monitoring: identity bar, checkboxes, progress, teacher view ---- */
  .idbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 8px;padding:12px 20px;background:var(--paper-raised);border:1px solid var(--line);border-top:none;border-radius:0 0 6px 6px;font-size:0.85rem;position:relative;}
  .idbar::before{content:'';position:absolute;top:-1px;left:16px;right:16px;border-top:1px dashed rgba(150,117,31,0.4);}
  .idbar .who{color:var(--slate);display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .idbar .who b{color:var(--ink);font-weight:600;}
  .idbar .who button{background:none;border:none;color:var(--brass-deep);font-size:0.8rem;padding:0;text-decoration:underline;}
  .idbar .sync-tag{font-size:0.7rem;color:var(--slate-light);display:inline-flex;align-items:center;gap:5px;}
  .idbar .sync-tag .sdot{width:6px;height:6px;border-radius:50%;background:var(--brass);animation:pulse 1.2s infinite;}
  .idbar .switch{background:var(--ink);color:var(--paper);border:none;border-radius:5px;padding:8px 16px;font-size:0.82rem;font-weight:600;flex-shrink:0;}
  .idbar .switch:hover{background:var(--ink-soft);}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.25;}}
  @media(max-width:560px){
    .idbar{flex-direction:column;align-items:stretch;text-align:center;}
    .idbar .who{justify-content:center;}
    .idbar .switch{width:100%;}
  }
  .setup-banner{background:var(--seal-soft);border:1px solid var(--seal);border-radius:6px;padding:12px 16px;font-size:0.82rem;color:var(--ink);margin:0 0 16px;line-height:1.6;}
  .setup-banner b{color:var(--seal);}

  .mh-progress{display:flex;align-items:center;gap:6px;flex-shrink:0;}
  .mh-progress .bar{width:44px;height:5px;border-radius:3px;background:var(--line);overflow:hidden;}
  .mh-progress .bar > span{display:block;height:100%;background:var(--brass);}
  .mh-progress .frac{font-size:0.72rem;color:var(--slate);}

  .week-block{display:flex;gap:12px;align-items:flex-start;}
  .week-check{flex-shrink:0;margin-top:2px;width:18px;height:18px;border:1.5px solid var(--line);border-radius:4px;background:var(--paper-raised);cursor:pointer;display:flex;align-items:center;justify-content:center;color:transparent;transition:transform .1s;}
  .week-check.done{background:var(--brass);border-color:var(--brass);color:var(--ink);}
  .week-check:active{transform:scale(0.88);}
  .week-check svg{width:12px;height:12px;}
  .week-main{flex:1;min-width:0;}
  .week-done-note{font-size:0.74rem;color:var(--brass-deep);margin-top:2px;}

  .teacher-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .teacher-toolbar h2{margin:0;}
  .student-row{border:1px solid var(--line);border-radius:6px;background:var(--paper-raised);margin-bottom:8px;overflow:hidden;}
  .student-row-head{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer;}
  .student-row-head:hover{background:var(--brass-soft);}
  .student-row .name{font-weight:600;width:150px;flex-shrink:0;}
  .student-row .bar-wrap{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden;}
  .student-row .bar-wrap > span{display:block;height:100%;background:var(--brass);}
  .student-row .count{width:70px;text-align:right;font-size:0.82rem;color:var(--slate);flex-shrink:0;}
  .student-row .last{width:110px;text-align:right;font-size:0.74rem;color:var(--slate-light);flex-shrink:0;}
  .student-row .chev{color:var(--slate-light);font-size:0.75rem;flex-shrink:0;}
  .student-detail{padding:4px 16px 16px;border-top:1px solid var(--line);}
  .student-detail .wk-chip{display:inline-block;font-size:0.74rem;padding:4px 9px;margin:4px 6px 0 0;border-radius:14px;background:var(--brass-soft);color:var(--brass-deep);}
  @media(max-width:640px){
    .student-row-head{flex-wrap:wrap;}
    .student-row .name{width:auto;}
    .student-row .last{display:none;}
  }
  .loading-note{padding:40px 20px;text-align:center;}
  .loading-note .empty-icon{color:var(--slate-light);margin-bottom:10px;}
  .loading-note .empty-title{font-family:var(--font-serif);font-size:1rem;margin-bottom:5px;}
  .loading-note .empty-sub{color:var(--slate);font-size:0.85rem;}
  .loading-note button{margin-top:14px;background:var(--ink);color:var(--paper);border:none;border-radius:6px;padding:8px 16px;font-size:0.82rem;}

  /* ---- Mode tabs (เรียน / ทดสอบ / ครู) ---- */
  .mode-tabs{display:flex;gap:0;margin:0 0 22px;border-bottom:1px solid var(--line);}
  .mode-tabs button{background:none;border:none;padding:11px 4px;margin-right:26px;font-size:0.9rem;color:var(--slate);font-weight:500;border-bottom:2px solid transparent;}
  .mode-tabs button.active{color:var(--ink);border-bottom-color:var(--brass);}

  /* ---- Quiz setup ---- */
  .quiz-setup{max-width:480px;}
  .quiz-setup .field{margin-bottom:16px;}
  .quiz-setup label{display:block;font-size:0.82rem;color:var(--slate);margin-bottom:6px;font-weight:500;}
  select{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:6px;background:var(--paper-raised);color:var(--ink);font-family:var(--font-sans);font-size:0.92rem;}
  .quiz-type-pick{display:flex;gap:10px;}
  .quiz-type-pick button{flex:1;padding:14px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper-raised);text-align:left;}
  .quiz-type-pick button.picked{border-color:var(--brass);background:var(--brass-soft);}
  .quiz-type-pick .qt-title{font-weight:600;font-size:0.9rem;margin-bottom:3px;}
  .quiz-type-pick .qt-desc{font-size:0.78rem;color:var(--slate);}
  .btn-primary{background:var(--ink);color:var(--paper);border:none;border-radius:6px;padding:12px 22px;font-size:0.92rem;font-weight:600;}
  .btn-primary:hover{background:var(--ink-soft);}
  .btn-primary:disabled{opacity:0.4;cursor:not-allowed;}
  .btn-secondary{background:none;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:11px 20px;font-size:0.88rem;}
  .btn-secondary:hover{border-color:var(--brass);}

  /* ---- Quiz session ---- */
  .quiz-progress{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;font-size:0.8rem;color:var(--slate);}
  .quiz-dots{display:flex;gap:5px;}
  .quiz-dots span{width:7px;height:7px;border-radius:50%;background:var(--line);}
  .quiz-dots span.filled{background:var(--brass);}
  .quiz-dots span.wrong{background:var(--seal);}
  .quiz-card{background:var(--paper-raised);border:1px solid var(--line);border-radius:6px;padding:28px 26px;margin-bottom:16px;}
  .quiz-prompt-label{font-size:0.76rem;color:var(--slate);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:8px;}
  .quiz-prompt{font-family:var(--font-serif);font-size:1.4rem;font-weight:600;margin-bottom:22px;line-height:1.4;}
  .quiz-prompt .blank{display:inline-block;border-bottom:2px solid var(--brass);min-width:90px;color:var(--brass-deep);}
  .quiz-options{display:flex;flex-direction:column;gap:10px;}
  .quiz-opt{text-align:left;padding:13px 16px;border:1px solid var(--line);border-radius:8px;background:var(--paper-raised);font-size:0.95rem;}
  .quiz-opt:hover{border-color:var(--brass);}
  .quiz-opt.correct{border-color:var(--brass);background:var(--brass-soft);color:var(--brass-deep);}
  .quiz-opt.wrong{border-color:var(--seal);background:var(--seal-soft);}
  .quiz-fill-row{display:flex;gap:10px;}
  .quiz-fill-row input[type=text]{flex:1;font-size:1.05rem;padding:13px 14px;}
  .quiz-feedback{margin-top:14px;padding:12px 14px;border-radius:6px;font-size:0.87rem;line-height:1.6;}
  .quiz-feedback.good{background:var(--brass-soft);color:var(--ink);}
  .quiz-feedback.bad{background:var(--seal-soft);color:var(--ink);}
  .quiz-actions{display:flex;justify-content:flex-end;margin-top:16px;}
  .quiz-result{text-align:center;padding:40px 20px;}
  .quiz-result .score-num{font-family:var(--font-serif);font-size:3rem;font-weight:700;color:var(--brass-deep);}
  .quiz-result .score-sub{color:var(--slate);font-size:0.9rem;margin-bottom:24px;}
  .quiz-empty{text-align:center;padding:40px 20px;color:var(--slate);}
  .week-sentence{font-size:0.82rem;color:var(--ink-soft);font-style:italic;margin:8px 0;padding:8px 12px;background:var(--brass-soft);border-radius:6px;}
  .quiz-history{border:1px solid var(--line);border-radius:6px;overflow:hidden;}
  .quiz-history-row{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-size:0.83rem;border-bottom:1px solid var(--line);background:var(--paper-raised);}
  .quiz-history-row:last-child{border-bottom:none;}
  .quiz-history-row .qh-type{color:var(--ink);}
  .quiz-history-row .qh-score{color:var(--brass-deep);font-weight:600;}
  .quiz-history-row .qh-date{color:var(--slate-light);font-size:0.76rem;}
</style>
</head>
<body>
<div id="app"></div>
<script>
const PHASES = [
  { id:'p1', num:1, range:'เดือน 1–3', level:'สู่ระดับ A1', title:'ปูพื้นฐาน',
    focus:['ออกเสียง (phonics) และไวยากรณ์พื้นฐาน','คำศัพท์ใช้บ่อย 600–800 คำ','ฝึกฟัง–พูดประโยคสั้นทุกวัน'],
    content:{
      vocab:[['meeting','การประชุม'],['schedule','ตารางเวลา'],['deadline','กำหนดส่ง'],['project','โครงการ'],['colleague','เพื่อนร่วมงาน'],['manager','ผู้จัดการ'],['department','แผนก'],['report','รายงาน'],['email','อีเมล'],['discuss','พูดคุย/หารือ'],['decide','ตัดสินใจ'],['budget','งบประมาณ'],['client','ลูกค้า'],['team','ทีม'],['task','งานที่ต้องทำ'],['appointment','นัดหมาย']],
      grammar:[
        {point:'Present Simple — พูดถึงกิจวัตร/ข้อเท็จจริง', example:'I work in the finance department. / I usually start at 8 AM.'},
        {point:'Past Simple — เล่าเหตุการณ์ที่จบไปแล้ว', example:'We had a meeting yesterday. / I called the client this morning.'},
        {point:'Wh-Questions — ตั้งคำถามพื้นฐาน', example:'What time is the meeting? / Where is the report?'},
      ],
      phrases:['Nice to meet you.','My name is ___ and I work as ___.','I usually start my day by ___.','Could you repeat that, please?','I don\u2019t understand — could you explain?'],
    },
    assignments:[
      {title:'แนะนำตัวเอง 60 วินาที', instr:'อัดคลิปเสียงแนะนำตัวเอง ชื่อ ตำแหน่ง บริษัท เป็นภาษาอังกฤษ ความยาวประมาณ 1 นาที', type:'audio'},
      {title:'บรรยายวันทำงานของคุณ', instr:'อัดคลิปวิดีโอเล่ากิจวัตรวันทำงานปกติของคุณ 5–7 ประโยคง่ายๆ', type:'video'},
      {title:'ทบทวนคำศัพท์ประจำสัปดาห์', instr:'อัดเสียงอ่านคำศัพท์ที่เรียนในสัปดาห์นี้ พร้อมแต่งประโยคตัวอย่างคนละ 1 ประโยค', type:'audio'},
    ]},
  { id:'p2', num:2, range:'เดือน 4–6', level:'สู่ A2', title:'สร้างฐานการสื่อสาร',

}

function getStudentName(){
  const params = new URLSearchParams(location.search);
  let name = params.get('student');
  if(!name){
    name = (prompt('กรุณาใส่ชื่อผู้เรียน (ใช้สำหรับบันทึกความคืบหน้า)') || '').trim();
    if(!name) name = 'ผู้เรียนไม่ระบุชื่อ';
    params.set('student', name);
    history.replaceState(null, '', location.pathname + '?' + params.toString());
  }
  return name;
}

function renameStudent(){
  const name = (prompt('เปลี่ยนชื่อผู้เรียน', studentName) || '').trim();
  if(!name) return;
  studentName = name;
  const params = new URLSearchParams(location.search);
  params.set('student', name);
  history.replaceState(null, '', location.pathname + '?' + params.toString());
  loadProgress();
}

async function loadProgress(){
  logLoaded = false; logError = false; render();
  if(!SHEET_API_URL){ logLoaded = true; quizLogLoaded = true; render(); return; }
  try{
    const res = await fetch(SHEET_API_URL + '?action=list');
    const json = await res.json();
    progressLog = json.data || [];
  }catch(err){
    logError = true;
  }
  logLoaded = true;
  render();
  loadQuizLog();
}

async function loadQuizLog(){
  quizLogLoaded = false;
  if(!SHEET_API_URL){ quizLogLoaded = true; render(); return; }
  try{
    const res = await fetch(SHEET_API_URL + '?action=quizlist');
    const json = await res.json();
    quizLog = json.data || [];
  }catch(err){
    // เงียบไว้ — ไม่บล็อกการใช้งานหน้าเรียนหลัก ถ้าดึงผลแบบทดสอบไม่สำเร็จ
  }
  quizLogLoaded = true;
  render();
}

function postQuizResult(){
  const entry = {
    kind: 'quiz',

    student: studentName,
    quizType: quizType,
    scope: quizScopePhase,

function latestStatusMap(){
  const map = new Map();
  progressLog.forEach(row=>{
    const key = row.student + '|' + row.week;
    const prev = map.get(key);
    if(!prev || new Date(row.timestamp) >= new Date(prev.timestamp)) map.set(key, row);
  });
  return map;
}

function isWeekDone(student, week){
  const row = latestStatusMap().get(student + '|' + week);
  return !!row && row.status === 'done';
}

function progressState(){
  const doneSet = new Set();
  WEEKS.forEach(w=>{ if(isWeekDone(studentName, w[0])) doneSet.add(w[0]); });
  let currentPhaseId = WEEKS[WEEKS.length-1][1];
  for(const w of WEEKS){ if(!doneSet.has(w[0])){ currentPhaseId = w[1]; break; } }
  return { doneSet, doneCount: doneSet.size, currentPhaseId };
}

function toggleWeek(num, phaseId, nextDone){
  const entry = { timestamp: new Date().toISOString(), student: studentName, week: num, phase: phaseId, status: nextDone ? 'done' : 'not_done' };

  fetch(SHEET_API_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(entry)
  }).catch(()=>{});
}

// ================= QUIZ / FILL-IN-THE-BLANK ENGINE =================
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function weeksInScope(phaseFilter){
  return phaseFilter==='all' ? WEEKS : WEEKS.filter(w=> w[1]===phaseFilter);
}

function vocabPoolForScope(phaseFilter){
  const pool = [];
  weeksInScope(phaseFilter).forEach(w=>{
    if(!w[3]) return;
    w[3].forEach(pair=> pool.push({ en:pair[0], th:pair[1], week:w[0] }));
  });
  return pool;
}

// Find one vocab entry that appears (whole-word-ish) inside a sentence, preferring the longest match
function findBlank(vocabArr, sentence){
  if(!vocabArr || !sentence) return null;
  const candidates = vocabArr.slice().sort((a,b)=> b[0].length - a[0].length);
  const lower = sentence.toLowerCase();
  const isWordChar = c => /[a-zA-Z]/.test(c||'');
  for(const [en,th] of candidates){
    const idx = lower.indexOf(en.toLowerCase());
    if(idx===-1) continue;
    const before = idx===0 ? ' ' : sentence[idx-1];
    const afterIdx = idx+en.length;
    const after = afterIdx>=sentence.length ? ' ' : sentence[afterIdx];
    if(isWordChar(before) || isWordChar(after)) continue;
    const actual = sentence.substr(idx, en.length);
    const blanked = sentence.slice(0,idx) + '_____' + sentence.slice(idx+en.length);
    return { blanked, answer: actual, hintTh: th };
  }
  return null;
}

function fillPoolForScope(phaseFilter){
  const pool = [];
  weeksInScope(phaseFilter).forEach(w=>{
    const [num,phaseId,title,vocab,output,sentence] = w;
    if(!sentence || !vocab) return;
    const m = findBlank(vocab, sentence);
    if(m) pool.push({ week:num, title, blanked:m.blanked, answer:m.answer, hintTh:m.hintTh });
  });
  return pool;
}

function buildMCQuestions(phaseFilter, count){
  const pool = vocabPoolForScope(phaseFilter);
  if(pool.length < 4) return [];
  const picked = shuffle(pool).slice(0, Math.min(count, pool.length));
  return picked.map(item=>{
    const enToTh = Math.random() < 0.5;
    const correctText = enToTh ? item.th : item.en;
    const promptText = enToTh ? item.en : item.th;
    let distractorPool = pool.filter(p=> p!==item && (enToTh ? p.th!==correctText : p.en!==correctText));
    distractorPool = shuffle(distractorPool).slice(0,3);
    const options = shuffle([correctText, ...distractorPool.map(d=> enToTh ? d.th : d.en)]);
    return {
      type:'mc', week:item.week, promptLabel: enToTh ? 'คำนี้แปลว่าอะไร' : 'ข้อความนี้ตรงกับคำศัพท์ใด',
      prompt: promptText, options, correctText
    };
  });
}

function buildFillQuestions(phaseFilter, count){
  const pool = fillPoolForScope(phaseFilter);
  const picked = shuffle(pool).slice(0, Math.min(count, pool.length));
  return picked.map(item=> ({ type:'fill', week:item.week, blanked:item.blanked, answer:item.answer, hintTh:item.hintTh }));
}

function startQuiz(){
  const questions = quizType==='mc' ? buildMCQuestions(quizScopePhase, 10) : buildFillQuestions(quizScopePhase, 10);
  quizQuestions = questions;
  quizIndex = 0; quizScore = 0; quizAnswered = false; quizSelectedOpt = null; quizFillValue = '';
  quizResultsLog = [];
  quizStage = questions.length===0 ? 'setup' : 'active';
  render();
}

function submitMCAnswer(optText){
  if(quizAnswered) return;
  quizAnswered = true;
  quizSelectedOpt = optText;
  const correct = optText === quizQuestions[quizIndex].correctText;
  if(correct) quizScore++;
  quizResultsLog.push(correct);
  render();
}

function normalizeAnswer(s){
  return s.trim().toLowerCase().replace(/[.,!?;:"']/g,'');
}

function submitFillAnswer(){
  if(quizAnswered) return;
  quizAnswered = true;
  const correct = normalizeAnswer(quizFillValue) === normalizeAnswer(quizQuestions[quizIndex].answer);
  if(correct) quizScore++;
  quizResultsLog.push(correct);
  render();
}

function nextQuizQuestion(){
  if(quizIndex < quizQuestions.length-1){
    quizIndex++; quizAnswered=false; quizSelectedOpt=null; quizFillValue='';
    render();
  } else {
    quizStage = 'result';
    postQuizResult();
    render();
  }
}

        <div class="quiz-prompt">${q.blanked.replace('_____','<span class="blank">_____</span>')}</div>
        <div class="quiz-fill-row">
          <input type="text" id="quiz-fill-input" placeholder="พิมพ์คำตอบที่นี่" value="${escapeHtml(quizFillValue)}" ${quizAnswered?'disabled':''} autocomplete="off">
          ${!quizAnswered ? `<button class="btn-primary" id="quiz-fill-submit">ตรวจคำตอบ</button>` : ''}
        </div>
      `}
      ${quizAnswered ? `<div class="quiz-feedback ${(q.type==='mc' ? quizSelectedOpt===q.correctText : normalizeAnswer(quizFillValue)===normalizeAnswer(q.answer)) ? 'good' : 'bad'}">
        ${(q.type==='mc' ? quizSelectedOpt===q.correctText : normalizeAnswer(quizFillValue)===normalizeAnswer(q.answer))
          ? '✓ ถูกต้อง!'
          : `✗ ยังไม่ถูก — คำตอบที่ถูกคือ “${escapeHtml(q.type==='mc'?q.correctText:q.answer)}”`}
        ${q.type==='fill' && q.hintTh ? ` (${escapeHtml(q.hintTh)})` : ''}
      </div>` : ''}
      <div class="quiz-actions">
        ${quizAnswered ? `<button class="btn-primary" id="quiz-next-btn">${quizIndex<quizQuestions.length-1?'ข้อถัดไป':'ดูผลคะแนน'}</button>` : ''}
      </div>
    </div>
  `;
}

function quizResultHtml(){
  const pct = Math.round(quizScore/quizQuestions.length*100);
  const msg = pct>=80 ? 'ยอดเยี่ยมมาก! คุณแม่นคำศัพท์ช่วงนี้ดีมาก' : pct>=50 ? 'ทำได้ดี ลองทบทวนคำที่ตอบผิดอีกครั้ง' : 'ควรทบทวนคำศัพท์ช่วงนี้เพิ่มเติมก่อนทำข้อสอบใหม่';
  return `
    <div class="quiz-result">
      <div class="score-num nums">${quizScore}/${quizQuestions.length}</div>
      <div class="score-sub">${msg}</div>
      <button class="btn-primary" id="quiz-retry-btn">ทำแบบทดสอบใหม่</button>
    </div>
  `;
}

function bindQuizSection(){
  if(quizStage==='setup'){
    document.querySelectorAll('[data-qt]').forEach(b=> b.onclick = ()=>{ quizType=b.dataset.qt; render(); });
    const scopeSel = document.getElementById('quiz-scope');
    if(scopeSel) scopeSel.onchange = (e)=>{ quizScopePhase = e.target.value; render(); };
    const startBtn = document.getElementById('quiz-start-btn');
    if(startBtn) startBtn.onclick = startQuiz;
  } else if(quizStage==='active'){
    document.querySelectorAll('.quiz-opt').forEach(b=> b.onclick = ()=> submitMCAnswer(b.dataset.opt));
    const fillInput = document.getElementById('quiz-fill-input');
    if(fillInput){
      fillInput.oninput = (e)=>{ quizFillValue = e.target.value; };
      fillInput.onkeydown = (e)=>{ if(e.key==='Enter') submitFillAnswer(); };
      fillInput.focus();
    }
    const fillSubmit = document.getElementById('quiz-fill-submit');
    if(fillSubmit) fillSubmit.onclick = submitFillAnswer;
    const nextBtn = document.getElementById('quiz-next-btn');
    if(nextBtn) nextBtn.onclick = nextQuizQuestion;
  } else {
    const retryBtn = document.getElementById('quiz-retry-btn');
    if(retryBtn) retryBtn.onclick = ()=>{ quizStage='setup'; render(); };
  }
}

function teacherDashboardHtml(){
  if(!logLoaded) return `<div class="loading-note">
    <div class="empty-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></div>
    <div class="empty-title">กำลังโหลดข้อมูลความคืบหน้า…</div>
    <div class="empty-sub">ดึงข้อมูลล่าสุดจาก Google Sheet</div>
  </div>`;
  if(logError) return `<div class="loading-note">
    <div class="empty-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 9v4M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg></div>
    <div class="empty-title">โหลดข้อมูลไม่สำเร็จ</div>
    <div class="empty-sub">ตรวจสอบการเชื่อมต่ออินเทอร์เน็ต แล้วลองอีกครั้ง</div>
    <button id="retry-load-btn">ลองอีกครั้ง</button>
  </div>`;
  const map = latestStatusMap();
  const students = new Map();
  map.forEach(row=>{
    if(row.status!=='done') return;
    const s = students.get(row.student) || { done:new Set(), last:row.timestamp };
    s.done.add(row.week);
    if(new Date(row.timestamp) > new Date(s.last)) s.last = row.timestamp;
    students.set(row.student, s);
  });
  const list = Array.from(students.entries()).sort((a,b)=> b[1].done.size - a[1].done.size);
  if(list.length===0) return `<div class="loading-note">
    <div class="empty-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></div>
    <div class="empty-title">ยังไม่มีผู้เรียนติ๊กความคืบหน้าเข้ามา</div>
    <div class="empty-sub">เมื่อผู้เรียนเริ่มติ๊กงานที่ทำเสร็จในหน้าเรียน รายชื่อจะขึ้นที่นี่โดยอัตโนมัติ</div>
  </div>`;
  return list.map(([name,s])=>{
    const pct = Math.round(s.done.size/96*100);
    const isOpen = expandedStudent===name;
    const weekNums = Array.from(s.done).sort((a,b)=>a-b);
    return `<div class="student-row">
      <div class="student-row-head" data-student="${escapeHtml(name)}">
        <span class="chev">${isOpen?'▾':'▸'}</span>
        <div class="name">${escapeHtml(name)}</div>
        <div class="bar-wrap"><span style="width:${pct}%"></span></div>
        <div class="count nums">${s.done.size}/96</div>
        <div class="last">${new Date(s.last).toLocaleDateString('th-TH',{day:'numeric',month:'short'})}</div>
      </div>
      ${isOpen ? `<div class="student-detail">
        <div style="font-size:0.78rem;color:var(--slate);margin-bottom:2px;">สัปดาห์ที่ทำเสร็จแล้ว (${weekNums.length}):</div>
        ${weekNums.map(n=>`<span class="wk-chip">สัปดาห์ ${n}</span>`).join('')}
        ${(()=>{ if(!quizLogLoaded) return `<div style="font-size:0.78rem;color:var(--slate-light);margin-top:14px;">กำลังโหลดผลแบบทดสอบ…</div>`; const qr = quizResultsFor(name).slice(0,5); return qr.length>0 ? `
          <div style="font-size:0.78rem;color:var(--slate);margin:14px 0 2px;">ผลแบบทดสอบล่าสุด:</div>
          <div class="quiz-history" style="margin-top:6px;">
            ${qr.map(r=>`<div class="quiz-history-row">
              <span class="qh-type">${escapeHtml(quizTypeLabel(r.quizType))} · ${escapeHtml(quizScopeLabel(r.scope))}</span>
              <span class="qh-score nums">${r.score}/${r.total}</span>
              <span class="qh-date">${new Date(r.timestamp).toLocaleDateString('th-TH',{day:'numeric',month:'short'})}</span>
            </div>`).join('')}
          </div>
        ` : `<div style="font-size:0.78rem;color:var(--slate-light);margin-top:14px;">ยังไม่มีประวัติแบบทดสอบ</div>`; })()}
      </div>` : ''}
    </div>`;
  }).join('');
}

studentName = getStudentName();
render();
loadProgress();
</script>
